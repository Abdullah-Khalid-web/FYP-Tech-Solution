<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon: central hub with connected nodes -->
  <g filter="url(#softShadow)">
    <!-- connecting lines -->
    <line x1="110" y1="150" x2="60" y2="80" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="150" x2="60" y2="220" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="150" x2="180" y2="60" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="150" x2="180" y2="240" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round"/>

    <!-- outer nodes -->
    <circle cx="60" cy="80" r="16" fill="url(#nodeGrad)"/>
    <circle cx="60" cy="220" r="16" fill="url(#nodeGrad)"/>
    <circle cx="180" cy="60" r="14" fill="url(#nodeGrad)"/>
    <circle cx="180" cy="240" r="14" fill="url(#nodeGrad)"/>

    <!-- central hub -->
    <circle cx="110" cy="150" r="42" fill="url(#hubGrad)"/>
    <!-- checkmark inside hub, nods to task management -->
    <path d="M92 150 L104 163 L130 133" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="140" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">
    <tspan fill="#1E1B4B">Manage</tspan><tspan fill="#6366F1">Hub</tspan>
  </text>

  <!-- Tagline -->
  <text x="234" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#6B7280" letter-spacing="2">STREAMLINE. ORGANIZE. DELIVER.</text>
</svg>
